services:
  backend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: civicaudit-backend:dev
    container_name: civicaudit-backend-dev
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=development
    volumes:
      # Mount host directory for real-time live code reloading
      - .:/app
      # Preserve container site-packages and pycache
      - /app/__pycache__
    restart: "no"
